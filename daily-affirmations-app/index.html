<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daily Affirmations - Start your day with positive energy and mindset. Get inspiring affirmations to boost your confidence and well-being.">
    <meta name="keywords" content="daily affirmations, positive thinking, motivation, self-help, mindfulness, personal growth">
    <meta name="author" content="Daily Affirmations App">
    <title>Daily Affirmations - Positive Mindset Every Day</title>

        <header class="app-header">
            <h1 class="app-title">Daily Affirmations</h1>
            <p class="app-subtitle">Transform your mindset, one affirmation at a time</p>
        </header>
        
        <section class="affirmation-section">
            <div id="affirmation-display" class="affirmation-text" role="main" aria-live="polite">
                Loading your daily affirmation...
            </div>
            
            <button id="next-affirmation-btn" class="next-btn" aria-label="Get a new affirmation">
                Get New Affirmation
            </button>
        </section>
        
        <footer class="app-footer">
            <p>✨ Embrace positivity every day ✨</p>
        </footer>
    </main>
